:root {

}

  max-width: 500px;

}
.page-wrap {

  overflow-x: hidden;
  overflow-y: auto;

  --orb-warm: 0;
  --smile-sx: 1;
  --smile-sy: 1;
  --smile-y: 0px;
}
.screen--records .orb[data-mood='attention'] .orb__float {
  animation: floatNormal 3.8s ease-in-out infinite;
}
.screen--records .orb[data-mood='attention'] .orb__shadow {
  animation: shadowBreath 3.8s ease-in-out infinite;
}
.screen--records .orb__signal {
  top: 3.5px;
  right: 6px;
  width: 16px;
  height: 16px;
  border: 2px solid #ffd0a9;
  background: #ffa153;
}
.screen--records .orb__signal::after {
  display: none;
}
.screen--records .rc-stat--attention .rc-stat__value {
  color: #ffa153;
}
.rc-card:not(.is-active) .orb[data-mood='attention'] .orb__float, .rc-card:not(.is-active) .orb[data-mood='attention'] .orb__shadow {
  animation: none;
}
.rc-cal {
  position: absolute;
  inset: 0;
  z-index: 50;
}
.rc-cal__dim {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.28);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.rc-cal__sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 18px 28.5px max(25px, var(--sab));
  border-radius: 20px 20px 0 0;
  background: #fff;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
}
.rc-cal.is-open .rc-cal__dim {
  opacity: 1;
}
.rc-cal.is-open .rc-cal__sheet {
  transform: none;
}
.rc-cal__head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 44px;
  color: #000;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.3px;
}
.rc-cal__head button {
  display: grid;
  place-items: center;
  width: 24px;
  height: 44px;
  color: #6b7280;
}
.rc-cal__head button:disabled {
  color: #d1d5db;
}
.rc-cal__week, .rc-cal__grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
}
.rc-cal__week {
  margin-top: 20.5px;
  color: #8c8c8c;
  font-size: 15px;
  font-weight: 500;
  line-height: 18px;
}
.rc-cal__grid {
  margin-top: 11.3px;
  grid-auto-rows: 45.4px;
}
.rc-cal__day {
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  color: #000;
  font-size: 14px;
  font-weight: 500;
  -webkit-tap-highlight-color: transparent;
}
.rc-cal__day.is-out {
  color: #9ca3af;
}
.rc-cal__day.is-today {
  color: var(--color-brand);
  font-weight: 700;
}
.rc-cal__day.is-selected {
  color: #fff;
  font-weight: 700;
}
.rc-cal__day.is-selected::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: -1;
  width: 36px;
  height: 36px;
  margin: -18px 0 0 -18px;
  border-radius: 50%;
  background: var(--color-brand);
}
.rc-cal__day:disabled {
  color: #d1d5db;
  cursor: default;
}
.rc-cal__day:not(:disabled):active {
  opacity: 0.6;
}
.screen--records .rc-head__month {
  position: relative;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.12s ease;
}
.screen--records .rc-head__month::before {
  content: '';
  position: absolute;
  inset: -12px -20px;
}
.screen--records .rc-head__month:active {
  opacity: 0.6;
}
.care-tl {
  background: #fff;
}
.page-wrap:not(.is-fullbleed) .care-tl {
  padding-top: 0;
}
.care-tl .page-header, .rc-flow__head {
  height: 47px;
}
.care-tl__list {
  position: relative;
  padding: 0 39px 24px 66px;
}
.care-tl__list::before {
  content: '';
  position: absolute;
  left: 40.5px;
  top: 28.5px;
  bottom: 0;
  width: 1px;
  background: #8fb4fa;
}
.care-tl__section {
  position: relative;
  padding-top: 21.5px;
}
.care-tl__section + .care-tl__section {
  padding-top: 14.5px;
}
.care-tl__dot {
  position: absolute;
  left: -31.5px;
  margin-top: 1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--color-brand);
  box-shadow: 0 0 0 1.5px #b3c7fe;
}
.care-tl__title {
  color: #29292d;
  font-size: 12px;
  font-weight: 600;
  line-height: 14px;
}
.care-tl__range {
  margin-top: 2.5px;
  color: #a1a1a1;
  font-size: 10px;
  font-weight: 500;
  line-height: 12px;
}
.care-tl__card {
  position: relative;
  display: flex;
  align-items: center;
  height: 60px;
  margin-top: 14px;
  padding: 0 19px 0 17px;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.08);
}
.care-tl__card + .care-tl__card {
  margin-top: 10px;
}
.care-tl__card.is-empty {
  justify-content: center;
  border: 1px dashed #d9d9d9;
  box-shadow: none;
}
.care-tl__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  color: var(--color-brand);
}
.care-tl__text {
  flex: 1 1 auto;
  min-width: 0;
  margin-left: 19px;
  align-self: flex-start;
  padding-top: 16.5px;
}
.care-tl__name {
  color: #29292d;
  font-size: 13px;
  font-weight: 600;
  line-height: 14px;
}
.care-tl__sub {
  margin-top: 4.5px;
  overflow: hidden;
  color: #a1a1a1;
  font-size: 10px;
  font-weight: 500;
  line-height: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.care-tl__card.is-empty .care-tl__sub {
  margin: 0;
  font-size: 11px;
}
.care-tl__card.is-watch .care-tl__sub {
  color: #ffa153;
}
.care-tl__time {
  flex: none;
  align-self: flex-start;
  margin-top: 16px;
  color: var(--color-brand);
  font-size: 10px;
  font-weight: 500;
  line-height: 12px;
}
.screen--records.is-open {
  overflow: hidden;
}
.rc-flow {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 100%;
  z-index: 15;
  overflow: hidden;
  background: #fff;
  will-change: clip-path;
}
.rc-flow__track {
  position: absolute;
  inset: 0;
  will-change: transform;
}
.screen--records .rc-flow__card.rc-card {
  position: absolute;
  right: auto;
  transform: none;
  border-color: transparent;
  box-shadow: none;
}
.rc-flow__detail {
  position: absolute;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  padding-top: var(--sat);
  background: #fff;
  color: var(--ink);
  letter-spacing: -0.02em;
}
.rc-flow__head {
  position: relative;
  flex: none;
  touch-action: none;
}
.rc-flow__scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--nav-h) + 16px);
  scrollbar-width: none;
}
.rc-flow__scroll::-webkit-scrollbar {
  display: none;
}
